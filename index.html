<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheetah Case</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <header class="header">
            <button class="close-btn">✕ Закрыть</button>
            <div class="logo-title">
                <span class="logo-icon">🐆</span>
                <span class="app-name">Cheetah Case</span>
            </div>
            <button class="menu-dots">•••</button>
        </header>

        <!-- Баланс -->
        <div class="balance-card">
            <div class="stars-count">⭐ 117</div>
            <button class="topup-btn">Пополнить</button>
        </div>

        <!-- Лента побед (LIVE) -->
        <div class="live-ticker">
            <span class="live-badge">LIVE</span>
            <div class="live-items">
                <span>🎁</span><span>🚀</span><span>📦</span><span>💎</span><span>👑</span>
            </div>
        </div>

        <!-- Меню режимов -->
        <div class="menu-list">
            <div class="menu-item free">
                <div class="item-icon">🎁</div>
                <div class="item-info">
                    <div class="item-title">Бесплатно</div>
                    <div class="item-subtitle">2 кейсов</div>
                </div>
            </div>

            <div class="menu-item plane">
                <div class="item-icon">🚀</div>
                <div class="item-info">
                    <div class="item-title">Plane <span class="badge-new">Новое</span></div>
                </div>
            </div>

            <div class="menu-item cases">
                <div class="item-icon">⭐ 1500</div>
                <div class="item-info">
                    <div class="item-title">Кейсы</div>
                    <div class="item-subtitle">19 кейсов</div>
                </div>
            </div>

            <div class="menu-item upgrade">
                <div class="item-icon">🐆</div>
                <div class="item-info">
                    <div class="item-title">Апгрейд</div>
                    <div class="item-subtitle">Улучшите свои подарки</div>
                </div>
            </div>

            <div class="menu-item crash">
                <div class="item-icon">🪐</div>
                <div class="item-info">
                    <div class="item-title">Краш</div>
                    <div class="item-subtitle">Онлайн</div>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <span class="nav-icon">🎮</span>
                <span>Игры</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🎁</span>
                <span class="badge-count">2</span>
                <span>Конкурсы</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📋</span>
                <span class="badge-count">6</span>
                <span>Задания</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🌍</span>
                <span>Турнир</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
